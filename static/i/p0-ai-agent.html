<title>p0-ai-agent</title>
<style>
  :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --border:#30363d;
          --code-bg:#161b22; --accent:#58a6ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
         "Hiragino Sans GB","Microsoft YaHei",sans-serif; line-height:1.7; }
  .wrap { max-width:900px; margin:0 auto; padding:32px 24px 80px; }
  h1,h2,h3,h4 { line-height:1.3; margin-top:1.8em; }
  h1 { border-bottom:1px solid var(--border); padding-bottom:.3em; margin-top:0; }
  h2 { border-bottom:1px solid var(--border); padding-bottom:.2em; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  code { font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
         background:var(--code-bg); padding:.2em .4em; border-radius:6px; font-size:.9em; }
  pre { background:var(--code-bg); padding:16px; border-radius:8px; overflow-x:auto;
        border:1px solid var(--border); }
  pre code { background:none; padding:0; font-size:.85em; }
  blockquote { margin:1em 0; padding:0 1em; color:var(--muted);
               border-left:.25em solid var(--border); }
  table { border-collapse:collapse; display:block; overflow-x:auto; margin:1em 0; }
  th,td { border:1px solid var(--border); padding:8px 12px; }
  th { background:var(--code-bg); }
  hr { border:none; border-top:1px solid var(--border); margin:2em 0; }
  .top-link { display:inline-block; margin-bottom:20px; font-size:.9em; }
  ul,ol { padding-left:2em; }
  .group { margin:1.5em 0; }
  .group ul { padding-left:0; list-style:none; }
  .group li { margin:.4em 0; }
  .group .src { color:var(--muted); font-size:.85em; margin-left:.5em; }
  .meta { color:var(--muted); font-size:.9em; margin-bottom:1em; }
</style>
</head>
